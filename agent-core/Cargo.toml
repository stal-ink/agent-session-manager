[package]
name = "agent-core"
version = "0.3.0"
edition = "2021"
description = "Shared IR, plugin protocol and SDK for Agent Session Manager"
license = "MIT"
readme = "README.md"
publish = false

[features]
default = []
sqlite = ["dep:rusqlite"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
rusqlite = { version = "0.41.1", features = ["bundled"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
uuid = { version = "1.29.2", features = ["v4"] }
