[package]
name = "agent-plugin-zcode"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "agent-plugin-zcode"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../../agent-core", features = ["sqlite"] }
anyhow = "1.0.104"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["v4"] }
