[package]
name = "agent-plugin-kimi"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "agent-plugin-kimi"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../../agent-core" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
uuid = { version = "1.29.2", features = ["v4"] }
