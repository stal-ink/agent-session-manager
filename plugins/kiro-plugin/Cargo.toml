[package]
name = "agent-plugin-kiro"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "agent-plugin-kiro"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../../agent-core", features = ["sqlite"] }
anyhow = "1.0.104"
rusqlite = "0.41.1"
serde_json = "1.0.154"
sha2 = "0.10"
uuid = { version = "1.29.2", features = ["v4"] }